const CARDS=[
{id:'book',kind:'책 개요',title:'요한복음은 어떤 책인가요',verses:[],keys:[],body:'요한복음은 전통적으로 사도 요한이 기록했다고 알려진 복음서예요. 기록 목적이 20장 31절에 직접 나와요. 예수가 그리스도시요 하나님의 아들이심을 믿고, 믿어서 생명을 얻게 하려는 것이에요. 기적을 "표적"이라 부르고, 빛과 어둠, 믿음과 생명 같은 말을 자주 써요.',refs:['요 20:31']},
{id:'context',kind:'본문 배경',title:'이 본문은 어떤 자리에 있나요',verses:[1,2],keys:['그런데','배경','앞'],body:'2장에서 예수님은 유월절에 예루살렘에 올라가 성전을 정결하게 하셨어요(2:13-22). 그때 많은 사람이 표적을 보고 그 이름을 믿었지만, 예수님은 사람 속을 아시기에 그들에게 자신을 맡기지 않으셨어요(2:23-25). 3장 1절의 "그런데"는 이 장면에 이어져, 니고데모를 표적을 보고 찾아온 사람들의 한 예로 보여줘요.',refs:['요 2:13-25']},
{id:'nico',kind:'인물',title:'니고데모',verses:[1,2,4,9],keys:['니고데모'],body:'바리새인이며 "유대인의 관원"으로 소개돼요. 요한복음에 세 번 나와요. 7장에서는 예수님을 함부로 정죄하지 말자고 동료들에게 말하고(7:50-51), 19장에서는 예수님의 장례를 위해 몰약과 침향을 가져와요(19:39). 밤에 찾아왔던 사람이 마지막에는 드러내 놓고 예수님 곁에 서는 모습이에요.',refs:['요 7:50-51','요 19:39']},
{id:'phar',kind:'용어',title:'바리새인',verses:[1],keys:['바리새'],body:'율법과 조상들의 전통을 철저히 지키려 했던 유대교의 한 무리예요. 회당을 중심으로 백성의 존경을 받았고, 부활과 천사를 믿었어요. 복음서에서는 예수님과 자주 논쟁하는 사람들로 나와요.',refs:[]},
{id:'ruler',kind:'용어',title:'유대인의 관원',verses:[1,10],keys:['관원','지도자','공회','산헤드린','선생'],body:'"관원"은 다스리는 사람이라는 뜻으로, 예루살렘의 최고 의회인 산헤드린의 의원을 가리킨다고 보는 해석이 일반적이에요(개역개정은 "지도자"로 옮겼어요). 산헤드린은 대제사장을 의장으로 한 약 70명의 의회로, 종교와 율법 문제를 다뤘어요. 10절에서 예수님은 그를 "이스라엘의 선생"이라고 부르세요.',refs:[]},
{id:'sign',kind:'용어',title:'랍비와 표적',verses:[2],keys:['랍비','표적'],body:'"랍비"는 "나의 선생님"이라는 뜻의 존칭이에요. 요한복음은 예수님의 기적을 "표적"이라고 불러요. 놀라운 일 자체보다 예수님이 누구신지를 가리키는 표시라는 뜻이 담겨 있어요. 첫 표적은 가나 혼인 잔치에서 물이 포도주가 된 일이에요(2:11).',refs:['요 2:11']},
{id:'night',kind:'질문 배경',title:'니고데모는 왜 밤에 왔을까',verses:[2],keys:['밤'],body:'몇 가지 견해가 있어요. 첫째, 동료들의 눈을 피하려 했다는 견해예요. 둘째, 랍비들이 하루 일을 마친 저녁에 율법을 토론하던 관습을 따랐다는 견해예요. 셋째, 요한복음이 빛과 어둠을 중요하게 쓰는 만큼(1:5, 3:19-21), 어둠 속에 있던 사람이 빛이신 분께 나아오는 장면으로 읽는 견해예요. 세 견해가 꼭 서로 배타적이지는 않아요.',refs:['요 1:5','요 3:19-21']},
{id:'we',kind:'질문 배경',title:'"우리"는 누구일까',verses:[2,11],keys:['우리'],body:'2절의 "우리"는 니고데모가 표적을 보고 관심을 가진 동료 지도자들이나 2장 23절의 사람들을 대표해서 말한 것으로 보는 해석이 많아요. 11절에서 예수님이 말씀하시는 "우리"는 예수님과 제자들, 또는 예수님과 앞서 증언한 세례 요한을 함께 가리킨다는 해석 등이 있어요.',refs:['요 2:23']},
{id:'born',kind:'단어',title:'거듭남: 다시, 또는 위로부터',verses:[3,4,7],keys:['거듭','다시','위로','태어'],body:'"거듭나다"의 헬라어 아노텐은 "다시"와 "위로부터"를 모두 뜻할 수 있어요. 니고데모는 "다시"로 알아듣고 어머니 배 속을 떠올렸지만(4절), 예수님은 하늘로부터, 곧 하나님께로부터 나는 새로운 출생을 말씀하신 것으로 보여요. 같은 단어가 31절에서는 "위로부터 오시는 이"로 쓰였어요.',refs:['요 3:31','요 1:12-13']},
{id:'water',kind:'질문 배경',title:'물과 성령으로 난다는 것',verses:[5],keys:['물'],body:'해석이 여러 갈래예요. 세례를 가리킨다는 견해, 육체의 출생(물)과 영적인 출생(성령)을 대비한다는 견해, 그리고 에스겔 36장 25-27절에서 하나님이 맑은 물로 씻고 새 영을 주시겠다고 하신 약속을 떠올리게 한다는 견해가 있어요. 마지막 견해는 "이스라엘의 선생으로서 알지 못하느냐"(10절)는 말씀과 잘 이어져요.',refs:['겔 36:25-27']},
{id:'wind',kind:'단어',title:'바람과 영은 같은 단어',verses:[6,8],keys:['바람','영'],body:'헬라어 프뉴마는 "바람"과 "영"을 함께 뜻해요. 히브리어 루아흐도 마찬가지예요. 그래서 8절은 말놀이처럼 읽혀요. 바람은 보이지 않지만 소리로 있는 줄 알듯이, 성령으로 난 사람도 그 열매로 성령의 일하심을 알 수 있다는 뜻이에요.',refs:[]},
{id:'son',kind:'용어',title:'인자',verses:[13,14],keys:['인자','하늘'],body:'"인자"는 예수님이 자신을 가리킬 때 가장 자주 쓰신 칭호예요. 다니엘 7장 13-14절에서 하늘 구름을 타고 와서 영원한 권세를 받는 "인자 같은 이"를 떠올리게 해요. 13절은 하늘의 일을 직접 보고 아는 분은 하늘에서 내려오신 예수님뿐이라는 뜻이에요.',refs:['단 7:13-14']},
{id:'snake',kind:'관련 구절',title:'모세의 놋뱀',verses:[14,15],keys:['뱀','모세','들려','광야'],body:'민수기 21장에서 광야의 백성이 하나님과 모세를 원망하다가 불뱀에 물려 죽어갈 때, 하나님은 모세에게 놋뱀을 만들어 장대 위에 달게 하셨고, 그것을 쳐다본 사람은 살았어요. 요한복음에서 "들리다"는 십자가에 달리심(12:32-33)과 높아지심을 함께 뜻해요.',refs:['민 21:4-9','요 12:32-33']},
{id:'only',kind:'단어',title:'독생자',verses:[16,18],keys:['독생자','외아들','아들'],body:'헬라어 모노게네스는 "하나뿐인, 유일한"이라는 뜻이에요. 하나뿐인 아들을 주셨다는 것이 16절 사랑의 크기를 보여줘요. 창세기 22장에서 아브라함이 "독자" 이삭을 바친 이야기(불씨 9번 세션)를 함께 떠올려 볼 수 있어요.',refs:['요 1:14','창 22:2']},
{id:'judge',kind:'단어',title:'심판과 정죄',verses:[17,18,19],keys:['심판','정죄'],body:'17-19절의 "심판"과 "정죄"는 헬라어에서 같은 뿌리의 말이에요. 개역개정은 19절을 "정죄"로, 다른 번역들은 "심판"으로 옮겼어요. 예수님은 세상을 심판하러 오지 않으셨지만, 빛을 거부하는 것 자체가 이미 심판이 된다는 뜻으로 읽을 수 있어요.',refs:[]},
{id:'light',kind:'주제',title:'빛과 어둠',verses:[19,20,21],keys:['빛','어둠'],body:'요한복음은 처음부터 예수님을 사람들의 빛으로 소개해요(1:4-9). 19-21절의 빛과 어둠은 2절에서 니고데모가 "밤에" 왔다는 것과도 이어져요. 진리를 따르는 사람은 빛으로 나아오고, 그 행위가 하나님 안에서 이루어졌음이 드러나요.',refs:['요 1:4-9','요 8:12']}
];

const CARDS_ACT1=[
{id:'act-book',kind:'책 개요',title:'사도행전은 어떤 책인가요',verses:[],keys:['사도행전','누가'],body:'사도행전은 누가가 누가복음에 이어 데오빌로에게 쓴 두 번째 책이에요(눅 1:3, 행 1:1). 누가복음이 예수님께서 행하시고 가르치신 일을 담았다면, 사도행전은 승천하신 예수님께서 성령으로 교회를 통해 계속 일하시는 이야기예요. 1장 8절의 "예루살렘과 온 유대와 사마리아와 땅 끝까지"가 책 전체의 흐름을 보여줘요.',refs:['눅 1:1-4','행 1:1-8']},
{id:'act-ctx',kind:'본문 배경',title:'승천과 오순절 사이의 열흘',verses:[12,13,14],keys:['기다','배경','왜'],body:'예수님은 부활 후 사십 일 동안 제자들에게 보이시고(1:3), 예루살렘을 떠나지 말고 아버지께서 약속하신 성령을 기다리라고 명하신 뒤 하늘로 올라가셨어요(1:4, 9). 오순절(2:1)은 부활 후 오십 일째이니, 이 본문은 승천과 성령 강림 사이의 열흘 남짓한 시간이에요. 제자들이 그 기다림을 기도와 말씀, 그리고 공동체를 바로 세우는 일로 채웠다는 것이 이 본문의 배경이에요.',refs:['행 1:3-11','행 2:1']},
{id:'act-olivet',kind:'장소',title:'감람원이라 하는 산',verses:[12],keys:['감람','산'],body:'예루살렘 성 동쪽, 기드론 골짜기 건너편의 산이에요. 올리브 나무가 많아서 감람산(올리브산)이라 불렸어요. 예수님께서 자주 기도하시던 겟세마네가 그 기슭에 있고, 이곳에서 승천하셨어요. 천사들은 예수님께서 가신 그대로 다시 오실 것이라고 말했어요(1:11, 슥 14:4).',refs:['눅 24:50-51','슥 14:4']},
{id:'act-sabbath',kind:'용어',title:'안식일에 가기 알맞은 길',verses:[12],keys:['안식일','길','거리'],body:'유대인의 전통에서 안식일에 걸어도 되는 거리를 말해요. 보통 2,000규빗, 오늘날로 약 900미터에서 1킬로미터 정도로 계산했어요. 누가는 이 표현으로 감람산이 예루살렘 성에서 아주 가까운 곳이라는 것을 알려줘요. 출애굽기 16장 29절과 여호수아 3장 4절을 바탕으로 랍비들이 정한 기준이에요.',refs:['출 16:29','수 3:4']},
{id:'act-upper',kind:'장소',title:'저희 유하는 다락',verses:[13],keys:['다락','어디','방'],body:'"다락"은 집의 위층 방을 말해요. 제자들이 머물며 함께 모이던 곳이에요. 성경은 누구의 집인지 말하지 않아요. 최후의 만찬을 나눈 큰 다락방(눅 22:12)과 같은 곳이라는 견해, 마가의 어머니 마리아의 집(행 12:12)이라는 견해가 있지만 확실하지는 않아요.',refs:['눅 22:12','행 12:12']},
{id:'act-eleven',kind:'인물',title:'열한 사도의 이름',verses:[13],keys:['사도','이름','열한','셀롯','시몬'],body:'누가복음 6장 14-16절의 열두 사도 명단과 견주어 보면 가룟 유다만 빠져 있어요. "셀롯인 시몬"은 로마에 맞서 이스라엘의 독립을 꿈꾸던 열심당 출신으로 보여요. 세리였던 마태와 열심당이었던 시몬이 한 공동체에 있다는 것 자체가 복음이 만든 새 공동체의 모습이에요. "야고보의 아들 유다"는 마태와 마가복음의 다대오와 같은 사람으로 보는 것이 일반적이에요.',refs:['눅 6:14-16','마 10:2-4']},
{id:'act-family',kind:'인물',title:'여자들, 마리아, 예수의 아우들',verses:[14],keys:['여자','마리아','아우','형제'],body:'"여자들"은 갈릴리에서부터 예수님을 따르며 섬기고 십자가와 무덤까지 함께했던 여인들이에요(눅 8:2-3, 23:55). 예수님의 어머니 마리아는 성경에서 이 장면에 마지막으로 이름이 나와요. "예수의 아우들"은 예수님 생전에는 믿지 않았지만(요 7:5) 부활 이후 믿게 되었어요. 그중 야고보는 부활하신 예수님을 만났고(고전 15:7), 뒤에 예루살렘 교회의 지도자가 되었어요(행 15:13).',refs:['눅 8:2-3','요 7:5','고전 15:7']},
{id:'act-pray',kind:'질문 배경',title:'마음을 같이하여 전혀 기도에 힘쓰니라',verses:[14],keys:['기도','마음','함께'],body:'"마음을 같이하여"는 한마음, 한뜻을 뜻하는 말로 사도행전에 여러 번 나와요(2:46, 4:24). "전혀 기도에 힘쓰니라"는 끈기 있게 붙들고 계속했다는 뜻이에요. 성령이 오실 것을 약속받은 제자들은 가만히 기다리지 않고 함께 모여 기도했어요. 매튜 헨리는 이 기다림의 시간을 약속을 붙들고 기도로 준비하는 시간으로 보았어요.',refs:['행 2:42','행 2:46','행 4:24']},
{id:'act-peter',kind:'인물',title:'베드로가 일어서다',verses:[15,16],keys:['베드로','왜 베드로'],body:'예수님을 세 번 부인했던 베드로가 이제 형제들 가운데 일어나 말씀으로 공동체를 이끌어요. 부활하신 예수님께서 베드로를 다시 세우시고 "내 양을 먹이라"고 맡기신 일(요 21:15-17)이 여기서 열매를 맺기 시작해요. 다만 베드로는 혼자 결정하지 않고 성경을 풀어 설명한 뒤 공동체 전체가 후보를 세우고 함께 기도해요.',refs:['눅 22:31-32','요 21:15-17']},
{id:'act-judas',kind:'질문 배경',title:'유다의 일과 하나님의 뜻',verses:[16,17,25],keys:['유다','배반','왜','성경이 응'],body:'베드로는 유다의 배반조차 성령께서 미리 말씀하신 성경의 성취라고 말해요. 하나님께서는 사람의 악까지도 당신의 구원 계획 안에서 다스리세요. 그러나 그렇다고 유다의 책임이 사라지지는 않아요. 예수님도 "인자는 이미 작정된 대로 가거니와 그를 파는 그 사람에게는 화가 있으리로다"(눅 22:22)라고 하셨어요. 개혁주의 전통은 하나님의 주권과 사람의 책임을 함께 붙들어요. 17절은 유다가 사도의 직무를 실제로 함께 맡았던 사람이었다는 것을 떠올려 줘요.',refs:['눅 22:22','요 13:18','요 17:12']},
{id:'act-akeldama',kind:'질문 배경',title:'유다의 죽음과 아겔다마',verses:[18,19],keys:['아겔다마','밭','죽음','피밭','마태'],body:'18-19절은 괄호 안에 있어요. 베드로의 말 중간에 누가가 독자를 위해 덧붙인 설명으로 보여요. 마태복음 27장 3-10절은 유다가 은 삼십을 성전에 던지고 목매어 죽었고, 제사장들이 그 돈으로 토기장이의 밭을 샀다고 해요. 두 기록은 이렇게 함께 읽을 수 있어요. 제사장들이 유다가 돌려준 돈으로 밭을 샀으니 그 밭은 유다의 돈으로 산 셈이고, 목맨 뒤 몸이 떨어져 터졌다는 것이에요. "아겔다마"는 그 지역 말인 아람어로 "피밭"이라는 뜻이에요.',refs:['마 27:3-10']},
{id:'act-psalm',kind:'관련 구절',title:'시편 69편과 109편',verses:[20],keys:['시편','직분','거처'],body:'베드로는 두 시편을 인용해요. "그의 거처로 황폐하게 하시며"는 시편 69편 25절, "그 직분을 타인이 취하게 하소서"는 시편 109편 8절이에요. 두 시편은 다윗이 의인을 미워하고 배신한 자들에 대해 드린 기도인데, 초대 교회는 이 말씀이 메시아와 그분을 배반한 자에게서 가장 온전히 이루어졌다고 읽었어요. 그래서 유다의 자리를 다른 사람이 채워야 한다는 결론으로 이어져요.',refs:['시 69:25','시 109:8']},
{id:'act-witness',kind:'용어',title:'사도의 자격: 부활의 증인',verses:[21,22],keys:['사도','자격','증인','증거','부활'],body:'새 사도의 자격은 두 가지예요. 요한의 세례 때부터 예수님께서 승천하신 날까지 늘 함께 다닌 사람이어야 하고, 그래서 예수님의 부활을 직접 증언할 수 있어야 해요. 사도행전에서 사도들의 가장 중요한 일은 "부활의 증인"이 되는 것이에요(2:32, 3:15, 4:33). 이 자격은 다음 세대가 다시 가질 수 없는 것이라, 사도는 교회의 터를 놓는 단 한 번의 직분으로 이해돼요(엡 2:20).',refs:['행 1:8','행 2:32','엡 2:20']},
{id:'act-twelve',kind:'질문 배경',title:'왜 꼭 열두 명이어야 했을까',verses:[21,22,26],keys:['열둘','열두','숫자','왜'],body:'열둘은 이스라엘 열두 지파를 떠올리게 하는 숫자예요. 예수님은 열두 제자를 세우시고, 그들이 이스라엘 열두 지파를 다스릴 것이라고 하셨어요(눅 22:30). 오순절에 성령이 임하시기 전에 열둘을 다시 채운 것은, 예수님을 통해 새롭게 회복되는 하나님의 백성이 이제 세워진다는 뜻으로 읽을 수 있어요. 뒤에 사도 야고보가 순교했을 때는(12:2) 다시 채우지 않았어요.',refs:['눅 22:28-30','행 12:2','계 21:14']},
{id:'act-two',kind:'인물',title:'요셉과 맛디아',verses:[23],keys:['요셉','바사바','유스도','맛디아'],body:'두 사람 모두 예수님의 공생애 내내 함께했던 제자였지만, 성경은 이 장면 말고는 두 사람에 대해 더 말하지 않아요. 바사바라고도 하고 유스도라고도 하는 요셉은 이름이 셋이나 나올 만큼 공동체에 잘 알려진 사람이었던 것 같아요. 맛디아는 "여호와의 선물"이라는 뜻의 이름으로 보여요. 이름이 기록에 남는 것보다, 처음부터 끝까지 예수님 곁에 신실하게 있었다는 것이 그들이 후보가 된 이유였어요.',refs:[]},
{id:'act-lots',kind:'질문 배경',title:'제비뽑기로 정해도 될까',verses:[24,25,26],keys:['제비','뽑','결정','정하'],body:'구약에서 제비뽑기는 하나님의 뜻을 묻는 방법으로 쓰였어요(레 16:8, 수 18:6). 잠언은 "제비는 사람이 뽑으나 일을 작정하기는 여호와께 있느니라"(16:33)고 말해요. 제자들은 먼저 기도하며 "주의 택하신 바"를 보여 달라고 구한 뒤 제비를 뽑았어요. 칼빈은 사도는 사람이 아니라 하나님께서 직접 부르셔야 하는 직분이기에 이런 방법을 쓴 것으로 보고, 이를 오늘날 교회가 함부로 본받을 일로 여기지 않았어요. 오순절 이후 사도행전에서는 제비뽑기가 다시 나오지 않고, 교회는 성령의 인도와 공동체의 분별로 일꾼을 세워요(6:3, 13:2).',refs:['잠 16:33','행 6:3','행 13:2']},
{id:'act-heart',kind:'질문 배경',title:'뭇사람의 마음을 아시는 주',verses:[24],keys:['마음','주여','아시는'],body:'제자들의 기도는 사람의 겉모습이 아니라 마음을 보시는 분께 드리는 기도예요(삼상 16:7). 같은 표현이 15장 8절에서는 하나님께 쓰였어요. 여기서 "주"를 예수님으로 보는 해석도 많아요. 처음 사도들을 친히 택하신 분이 예수님이시기 때문이에요(1:2). 어느 쪽이든 제자들은 사도를 세우는 일이 사람의 선택이 아니라 주님의 선택이기를 구했어요.',refs:['삼상 16:7','행 15:8','행 1:2']},
{id:'act-words',kind:'말 풀이',title:'개역한글의 어려운 말',verses:[13,16,17,19,23,25],keys:['뜻','무슨','지로','천하','참예','본방언','의탁','유하','곤두박질'],body:'유하는(13절): 머물러 지내는. 의탁하사(16절): 통하여, 입을 빌려. 지로한(16절): 길을 안내한, 앞장선. 참예하여(17절): 함께 참여하여. 본방언(19절): 그곳 사람들의 말, 곧 아람어. 천하니(23절): 추천하니, 후보로 세우니. 제 곳으로 갔나이다(25절): 자기에게 마땅한 곳으로 갔다는 뜻으로, 유다의 최후를 조심스럽게 표현한 말이에요.',refs:[]}

const NOI='[data-noi18n],.verse,.txt,textarea,script,style,[lang="ko"],.bubble .t,.who b';
function trText(t){const m=String(t).match(/^(\s*)([\s\S]*?)(\s*)$/);const core=m[2];if(!core||!/[가-힣]/.test(core))return null;let out=DICT[core];if(out==null){for(const [re,f] of PATS){const r=core.match(re);if(r){out=typeof f==='function'?f(...r):f;break}}}return out==null?null:m[1]+out+m[3]}
function tr(root){if(!isEN()||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];while((n=w.nextNode())){const pe=n.parentElement;if(!pe||pe.closest(NOI))continue;const o=trText(n.nodeValue);if(o!=null)todo.push([n,o])}todo.forEach(([n,o])=>{n.nodeValue=o});
 root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{if(el.closest('[data-noi18n]'))return;['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v){const o=trText(v);if(o!=null)el.setAttribute(a,o)}})})}
function setUiLang(l){S.uiLang=l==='en'?'en':'ko';document.title=isEN()?'Bible On Air':'바이블 온에어';try{localStorage.setItem('boa-ui',S.uiLang)}catch(e){}document.documentElement.lang=S.uiLang;let bibleSaved=null;try{bibleSaved=localStorage.getItem('boa-lang')}catch(e){}if(!bibleSaved)S.lang=S.uiLang;render();if(typeof renderInstall==='function')renderInstall()}

(()=>{const A=window.alert.bind(window),C=window.confirm.bind(window);window.alert=m=>A(isEN()?(trText(m)||m):m);window.confirm=m=>C(isEN()?(trText(m)||m):m)})();

const myGroups=()=>memsOf(S.uid).map(m=>m.gid).sort((a,b)=>(G.groups[a].at||0)-(G.groups[b].at||0));
const isOps=()=>G.ops&&!S.persona;
const inApp=()=>isOps()||!!(G.cm||{})[S.uid]||myGroups().length>0;
const maxLevel=uid=>Math.max(levelOf(uid),((G.cm||{})[uid]||{}).level||0);
const canRequestGroup=()=>isOps()||maxLevel(S.uid)>=4;
const communityPending=()=>Object.entries(G.cr||{}).filter(([u,r])=>!(G.cm||{})[u]&&!memsOf(u).length).map(([u,r])=>Object.assign({uid:u},r)).sort((a,b)=>(a.at||0)-(b.at||0));
const leadBadge=()=>{const people=new Set();let n=0;if(isOps()){communityPending().forEach(r=>people.add(r.uid));n+=pendingGreqs().length}adminGroups().forEach(g=>{Object.values(G.reqs).filter(r=>r.gid===g&&!G.mems[memKey(r.uid,g)]).forEach(r=>people.add(r.uid))});return n+people.size};
const curG=()=>{if(S.g&&G.groups[S.g]&&(myGroups().includes(S.g)||isOps()))return S.g;return myGroups()[0]||(isOps()?Object.keys(G.groups)[0]||null:null)};
const GRP=()=>G.groups[curG()]||null;
const isGAdmin=(gid,uid)=>{uid=uid||S.uid;if(!gid)return false;if(uid===S.realUid&&isOps())return true;const m=G.mems[memKey(uid,gid)];return !!m&&(m.role==='admin'||m.role==='leader')};
const adminGroups=()=>Object.keys(G.groups).filter(g=>isGAdmin(g));
const canManage=()=>isOps()||adminGroups().length>0;
const gKey=id=>{const x=GRP();return !x||x.legacy?id:`${curG()}.${id}`};
const gidOfStudy=itemId=>{const r=String(itemId).replace(/^study-/,'');return r.includes('.')?r.split('.')[0]:LEGACY_G};
const postGid=p=>p.gid||LEGACY_G;
const groupName=gid=>{const x=G.groups[gid];if(!x)return '';return (isEN()&&x.name==='BOA 불씨 그룹')?'BOA Sparks Group':x.name};
const switchList=()=>isOps()?Object.keys(G.groups).sort((a,b)=>(G.groups[a].at||0)-(G.groups[b].at||0)):myGroups();
function rememberG(){try{localStorage.setItem('boa-g:'+S.uid,S.g||'')}catch(e){}}
function recallG(){try{return localStorage.getItem('boa-g:'+S.uid)||null}catch(e){return null}}
/* 지금 보고 있는 그룹을 예전의 '한 그룹'처럼 보이게 하는 연결층 */
function recompute(){const g=curG();S.g=g;const ap={},rq={};
 Object.values(G.mems).forEach(m=>{if(m.gid===g)ap[m.uid]=Object.assign({},m,{leader:m.role==='admin'||m.role==='leader'})});
 Object.values(G.reqs).forEach(r=>{if(r.gid===g&&!ap[r.uid])rq[r.uid]=r});
 if(!myGroups().length)Object.values(G.reqs).forEach(r=>{if(r.uid===S.uid)rq[r.uid]=r});
 S.approvals=ap;S.requests=rq;const x=GRP();
 S.config={hideStep1:!x||x.hideStep1!==false,schedule:(x&&x.schedule)||null};
 S.canEdit=!!g&&isGAdmin(g);S.isOps=isOps();
 if(DB){const all=new Set([S.uid]);Object.values(G.mems).forEach(m=>all.add(m.uid));all.forEach(subItems)}}
function saveGroup(id,patch){const x=Object.assign({},G.groups[id],patch);G.groups[id]=x;save('groups/'+id,x,0);recompute()}
function saveMem(uid,gid,patch){const k=memKey(uid,gid);const x=Object.assign({},G.mems[k],patch,{uid,gid});G.mems[k]=x;save('memberships/'+k,x,0);recompute()}
function dropMem(uid,gid){const k=memKey(uid,gid);delete G.mems[k];save('memberships/'+k,null,0);recompute()}
function dropReq(uid,gid){const k=memKey(uid,gid);delete G.reqs[k];save('joinreqs/'+k,null,0);recompute()}
function sendJoin(gid,extra){if(!gid||!G.groups[gid]||S.readOnly)return;const jr=Object.assign({uid:S.uid,gid,at:Date.now()},gid===INVITE&&JOINCODE?{code:JOINCODE}:{},extra||{});G.reqs[memKey(S.uid,gid)]=jr;save('joinreqs/'+memKey(S.uid,gid),jr,0);recompute()}
const newSchedule=()=>({mode:'curriculum',cycle:'week',weekday:0,days:7,tz:'America/Vancouver',startSession:1,custom:{},anchor:weekStart(todayIn('America/Vancouver'),0)});
const inviteLink=gid=>`${location.origin}${location.pathname}?join=${encodeURIComponent(gid)}${G.groups[gid]&&G.groups[gid].open===false&&groupCode(gid)?'&code='+encodeURIComponent(groupCode(gid)):''}`;
let JOINCODE=null;
let INVITE=(()=>{try{const u=new URLSearchParams(location.search);const q=u.get('join'),c=u.get('code');if(q){localStorage.setItem('boa-join',q);if(c)localStorage.setItem('boa-joincode',c);else localStorage.removeItem('boa-joincode');try{history.replaceState(null,'',location.pathname)}catch(e){}}JOINCODE=localStorage.getItem('boa-joincode');return localStorage.getItem('boa-join')}catch(e){return null}})();
function clearInvite(){INVITE=null;JOINCODE=null;try{localStorage.removeItem('boa-join');localStorage.removeItem('boa-joincode')}catch(e){}}

/* ---------- 그룹 만들기 요청, 열린/닫힌 그룹, 초대 코드 ---------- */
G.greqs={};G.codes={};
const byAt=(a,b)=>(G.groups[a].at||0)-(G.groups[b].at||0);
const isOpen=gid=>{const x=G.groups[gid];return !!x&&x.open!==false};
const openGroups=()=>Object.keys(G.groups).filter(isOpen).sort(byAt);
const joinable=()=>{const l=openGroups();if(INVITE&&G.groups[INVITE]&&!l.includes(INVITE)&&JOINCODE)l.unshift(INVITE);return l.filter(k=>!myGroups().includes(k))};
const groupCode=gid=>(G.codes[gid]||{}).code||'';
const myGreqs=()=>Object.entries(G.greqs).filter(([k,r])=>r.uid===S.uid).map(([k,r])=>Object.assign({id:k},r)).sort((a,b)=>(b.at||0)-(a.at||0));
const pendingGreqs=()=>Object.entries(G.greqs).filter(([k,r])=>r.status==='pending').map(([k,r])=>Object.assign({id:k},r)).sort((a,b)=>(a.at||0)-(b.at||0));
const newCode=()=>Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8);
function ensureCode(gid){if(groupCode(gid))return;const x={gid,code:newCode(),at:Date.now()};G.codes[gid]=x;save('gcodes/'+gid,x,0)}

/* ---------- 그룹 정보 (그룹 찾기 카드에 보이는 것) ---------- */

const GLANGS={ko:'한국어',en:'영어',both:'한국어와 영어'};
const gCount=gid=>Object.values(G.mems).filter(m=>m.gid===gid).length;
const gFull=gid=>{const g=G.groups[gid]||{};return !!g.cap&&gCount(gid)>=+g.cap};
const gRecruiting=gid=>{const g=G.groups[gid]||{};return g.recruiting!==false&&!gFull(gid)};
const gLeaders=gid=>Object.values(G.mems).filter(m=>m.gid===gid&&(m.role==='admin'||m.role==='leader')).map(m=>nameOf(m.uid));
function gStudy(gid){const g=G.groups[gid];if(!g)return '';try{const sch=schedule(g.schedule||{});const se=sessionOf(sch,nthPeriod(sch,periodIndex(sch,todayIn(sch.tz))));const ref=refsLabel(se.refs||[]);if(!ref)return isEN()?'Passage coming soon':'본문 준비 중';return sch.mode==='curriculum'&&se.no?`${GROUPS[0]} ${isEN()?'Course':'과정'} · ${ref}`:ref}catch(e){return ''}}
const gMeet=gid=>{const g=G.groups[gid]||{};return [g.mode?(isEN()?{online:'Online',offline:'In person',both:'Online & in person'}[g.mode]:MODES[g.mode]):'',g.mode&&g.mode!=='online'&&g.place?g.place:'',g.when||''].filter(Boolean).join(' · ')};
const gLang=gid=>{const l=(G.groups[gid]||{}).lang;return l?(isEN()?{ko:'Korean',en:'English',both:'Korean & English'}[l]:GLANGS[l]):''};
const gPeople=gid=>{const g=G.groups[gid]||{};const n=gCount(gid);const cnt=g.cap?`${n} / ${g.cap}${isEN()?'':'명'}`:`${n}${isEN()?(n===1?' member':' members'):'명'}`;return `${cnt} · ${gRecruiting(gid)?(isEN()?'open':'모집 중'):(isEN()?'full':'모집 마감')}`};
const GFILTERS=[['all','전체'],['online','온라인'],['offline','오프라인'],['ko','한국어'],['en','영어'],['welcome','처음 오신 분 환영']];
function gMatch(gid,f){const g=G.groups[gid]||{};if(f==='online')return g.mode==='online'||g.mode==='both';if(f==='offline')return g.mode==='offline'||g.mode==='both';if(f==='ko')return !g.lang||g.lang==='ko'||g.lang==='both';if(f==='en')return g.lang==='en'||g.lang==='both';if(f==='welcome')return !!g.welcome;return true}
const badge=(t,kind)=>`<span style="flex-shrink:0;font-size:12px;padding:3px 8px;border-radius:10px;font-weight:700;${kind==='warm'?'background:#FFF4ED;color:#9A3412':'background:var(--soft2);color:var(--fg)'}">${t}</span>`;

async function migrateLegacy(){if(!isOps()||Object.keys(G.groups).length)return false;
 let ap={},rq={},cfg={},ad={};try{(await DB.collection('approvals').get()).docs.forEach(d=>ap[d.id]=d.data())}catch(e){}
 try{(await DB.collection('requests').get()).docs.forEach(d=>rq[d.id]=d.data())}catch(e){}
 try{(await DB.collection('admins').get()).docs.forEach(d=>ad[d.id]=d.data())}catch(e){}
 try{const c=await DB.doc('config/group').get();if(c.exists)cfg=c.data()}catch(e){}
 const now=Date.now();const writes=[['groups/'+LEGACY_G,{name:'BOA 불씨 그룹',legacy:true,schedule:cfg.schedule||null,hideStep1:cfg.hideStep1!==false,at:now}]];
 if(!ap[S.realUid])ap[S.realUid]={at:now,level:0,leader:true};
 Object.entries(ap).forEach(([uid,a])=>{const m=Object.assign({},a,{uid,gid:LEGACY_G,role:(a.leader||ad[uid]||uid===S.realUid)?'admin':'member'});delete m.leader;writes.push(['memberships/'+memKey(uid,LEGACY_G),m])});
 Object.entries(rq).forEach(([uid,r])=>{if(!ap[uid])writes.push(['joinreqs/'+memKey(uid,LEGACY_G),Object.assign({},r,{uid,gid:LEGACY_G})])});
 for(const [p,d] of writes){try{await DB.doc(p).set(d)}catch(e){console.warn('migrate',p,e)}}
 return true}

function hasContent(st,k){const s=st.steps[k];if(!s)return false;if(s.free)return true;
 if(k===1)return Object.keys(s.hl||{}).length||(s.qs||[]).length||Object.values(s.memos||{}).some(Boolean)||Object.values(s.guide||{}).some(Boolean)||Object.values(s.rounds||{}).some(Boolean);

function noText(k){const se=SES();const s=S.mine.steps[k];
 return `<div class="sec"><div class="note" style="display:flex;flex-direction:column;gap:8px"><b>${esc(se.label)}</b><span style="font-size:14px">성경 본문을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요. 그동안 성경 앱에서 본문을 열어 읽고, 발견한 것을 아래에 적어 둘 수 있어요.</span><div class="wrapRow">${se.refs.map(r=>`<a class="chip" href="${bibleRange('RNKSV',88,r)}" target="_blank" rel="noopener">개역개정 ${esc(refsLabel([r]))}</a><a class="chip" href="${bibleRange('NIV',111,r)}" target="_blank" rel="noopener">NIV</a>`).join('')}</div></div></div>
 <div class="sec"><label class="mini" style="display:flex;flex-direction:column;gap:6px">${k}단계 ${STEPS[k].t}에서 발견한 것<textarea data-bind="s${k}.free" rows="8" placeholder="${esc(STEPS[k].s)}">${esc(s.free||'')}</textarea></label></div>`}
function viewStudy(){if(!SES().id)return viewHome();if(!S.mine)return '<div aria-hidden="true" style="min-height:240px"></div>';const k=S.step;
 const vs=versesState();const body=vs==='ok'?[null,step1,step2,step3,step4,step5][k]():vs==='loading'?'<p class="empty">성경 본문을 불러오는 중이에요</p>':noText(k);
 return `<div class="${k===2?'':'wrap'}">${stepHeader(k)}${stepTabs(k)}${body}${stepFooter(k)}</div>`}

/* 1단계 */
function verseWords(v,interactive){const st=S.mine.steps[1];const text=TXT(v);const qs=st.qs.filter(q=>q.v===v&&(q.lang||'ko')===S.lang);const lp=S.lang==='en'?'en:':'';
 if(!interactive)return esc(text);
 return text.split(' ').map((w,i)=>{const key=lp+v+':'+i;const c=st.hl[key]||'';const q=qs.find(x=>x.i===i);return `<button class="w ${c}${q?' q':''}" data-act="word" data-v="${v}" data-i="${i}">${esc(w)}</button>${q?'<span class="pin" aria-label="질문 핀">?</span>':''}`}).join(' ')}
function step1(){const st=S.mine.steps[1];const r=st.round;const tool=S.ui.tool;
 const tabs=`<div class="tablist" role="tablist" aria-label="읽기 회차" style="grid-template-columns:repeat(3,minmax(0,1fr))">${Object.keys(ROUNDS).map(id=>`<button role="tab" aria-selected="${r===id}" data-act="round" data-r="${id}">${ROUNDS[id][0]}${st.rounds[id]?' ✓':''}</button>`).join('')}</div>`;
 const guide=r==='r2'?`<div class="sec" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${[['who','누가'],['when','언제'],['where','어디서'],['what','무엇을']].map(([f,l])=>`<label class="mini">${l}<input type="text" data-bind="s1.guide.${f}" value="${esc(st.guide[f]||'')}"></label>`).join('')}</div>`:'';
 const verses=VV().map(({t,v})=>{const qs=st.qs.filter(q=>q.v===v);const memo=st.memos[v];const draft=S.ui.qDraft&&S.ui.qDraft.v===v;const memoOpen=S.ui.openVerse===v;
  return `<div style="padding:6px 0"><p class="verse"><button class="vn" data-act="memo" data-v="${v}" aria-label="${LBL(v)}절 메모">${LBL(v)}</button>${verseWords(v,r!=='r1')}</p>
  ${r!=='r1'?qs.map(q=>`<div class="bubble">${avatar(S.uid,26)}<span class="t">${esc(q.text)}</span><button class="ic" style="width:32px;height:32px" data-act="delQ" data-id="${q.id}" aria-label="질문 지우기">${IC.x()}</button></div>`).join(''):''}
  ${draft?`<div class="bubble" style="flex-wrap:wrap"><input type="text" id="qinput" data-bind="ui.qText" placeholder="이 단어에서 궁금한 점" style="flex:1;min-width:200px"><button class="btn sm" data-act="saveQ">질문 남기기</button><button class="btn sm ghost" data-act="cancelQ">취소</button></div>`:''}
  ${r!=='r1'&&(memoOpen||memo)?`<textarea data-bind="s1.memo.${v}" placeholder="${LBL(v)}절에서 관찰한 것, 느낀 것" rows="2" style="margin-top:4px">${esc(memo||'')}</textarea>`:''}</div>`}).join('');
 const tools=r==='r1'?`<div style="padding:20px 16px 8px"><button class="btn block" data-act="roundDone">${st.rounds.r1?'다 읽었어요 ✓':'다 읽었어요'}</button></div>`
  :`<div class="toolbar" aria-label="표시 도구" style="flex-wrap:nowrap">${S.ui.hlPanel?`<div class="hlpanel" role="dialog" aria-label="형광펜 색">${hlPanelHTML(true)}</div>`:''}<div class="toolscroll">${(r==='r2'?[['person','인물','var(--per)'],['place','장소','var(--pla)']]:[['rep','반복','var(--rep)']]).map(([id,l,c])=>`<button class="tool ${tool===id?'on':''}" data-act="tool" data-t="${id}" aria-pressed="${tool===id}"><span class="dot" style="background:${c}"></span>${l}</button>`).join('')}<button class="tool ${S.ui.hlPanel?'on':''}" data-act="hlPanel" aria-expanded="${!!S.ui.hlPanel}" aria-label="형광펜 색과 진하기">🎨 색</button>
   ${r==='r3'?`<button class="tool ${tool==='q'?'on':''}" data-act="tool" data-t="q" aria-pressed="${tool==='q'}"><span class="pin" style="margin:0">?</span>질문</button>`:''}
   
   </div><button class="btn sm ${st.rounds[r]?'':'ghost'}" data-act="roundDone" style="flex-shrink:0">${st.rounds[r]?'완료 ✓':'회차 완료'}</button></div>`;
 return `${tabs}<div class="sec" style="border-bottom:0"><p class="sub" style="margin:0">${ROUNDS[r][1]}${r!=='r1'?(isEN()?' Choose a tool, then tap a word. Tap a verse number to write a note.':' 도구를 고른 뒤 단어를 눌러요. 절 번호를 누르면 메모를 쓸 수 있어요.'):''}</p></div>${guide}<div style="padding:0 18px">${verses}</div>${tools}`}

/* 2단계 */
function linkedCards(q){const qv=(VV().find(x=>x.v===q.v)||{}).vn||q.v;const byKey=J3CARDS().filter(c=>c.keys.some(k=>q.text.includes(k)));const byVerse=J3CARDS().filter(c=>c.verses.includes(qv)&&!byKey.includes(c));return byKey.concat(byVerse).slice(0,3)}
function cardHTML(c,open){return `<div class="card" data-noi18n><button data-act="card" data-id="${c.id}" aria-expanded="${open}" style="border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit"><span class="k">${esc(c.kind)}${c.verses.length?' · '+c.verses.join(', ')+'절':''}</span><span class="h">${esc(c.title)}</span></button>
 ${open?`<p style="margin:0;font-size:14px;line-height:1.7">${esc(c.body)}</p>${c.refs.length?`<div class="wrapRow">${c.refs.map(r=>`<span class="chip">${esc(r)}</span>`).join('')}</div>`:''}<span class="src">${SRC}</span>`:''}</div>`}
function step2(){const st=S.mine.steps[2];const qs=S.mine.steps[1].qs;const ov=S.ui.openVerse;
 const J=SES().isJ3;const list=VV().map(({t,v,e,b,c,vn,label})=>{const open=ov===v;const w=WORDS2[b+'.'+c+'.'+vn]||null;
  return `<div style="border-bottom:1px solid var(--line);padding:12px 16px">
  <button data-act="openV" data-v="${v}" aria-expanded="${open}" style="border:0;background:none;padding:0;text-align:left;width:100%;color:inherit"><p class="verse" style="font-size:16px"><span class="vn">${label}</span><span lang="${S.lang}">${esc(mainT({t,e}))}</span>${st.memos[v]?' <span class="badge">메모</span>':''}</p></button>
  ${open?`<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
   <div class="row" style="align-items:flex-start"><span class="sub" style="width:64px;flex-shrink:0">${S.lang==='en'?'개역한글':'BSB'}</span><span lang="${S.lang==='en'?'ko':'en'}" style="line-height:1.6">${(S.lang==='en'?t:e)?esc(S.lang==='en'?t:e):`<span class="sub">이 절은 ${S.lang==='en'?'개역한글':'BSB'}에 따로 없어요</span>`}</span></div>
   <div class="row" style="align-items:flex-start"><span class="sub" style="width:64px;flex-shrink:0">다른 번역</span><div class="wrapRow">${LINKS.map(L=>`<a class="chip" href="${L.url(b,c,vn)}" target="_blank" rel="noopener">${L.n}</a>`).join('')}</div></div>
   ${w?`<div class="note" data-noi18n><b>${w[0]}</b> <span class="sub">${w[1]}</span><div style="font-size:14px">${esc(w[2])}</div></div>`:''}
   <label class="mini">비교 메모<textarea data-bind="s2.memo.${v}" rows="2" placeholder="번역을 견주며 발견한 것">${esc(st.memos[v]||'')}</textarea></label></div>`:''}</div>`}).join('');
 const myQs=qs.length?qs.map(q=>{const cs=linkedCards(q);return `<div style="display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)"><div class="bubble" style="margin:0">${avatar(S.uid,26)}<span class="t">${LBL(q.v)}절, ${esc(q.text)}</span></div>${cs.length?cs.map(c=>cardHTML(c,S.ui.openCard===c.id)).join(''):'<span class="sub">연결할 배경을 준비 중이에요</span>'}</div>`}).join(''):`<p class="sub">1단계에서 꽂은 질문 핀이 여기 모여요.</p>`;
 const others=J3CARDS().map(c=>cardHTML(c,S.ui.openCard===c.id)).join('');
 const pane=S.studyPane;
 return `<div class="banner">배경 노트가 열렸어요. ${qs.length?`내 질문 ${qs.length}개와 연결했어요.`:''}</div>
 <div class="tablist paneTabs" role="tablist" style="grid-template-columns:1fr 1fr"><button role="tab" aria-selected="${pane==='text'}" data-act="pane" data-p="text">번역 비교</button><button role="tab" aria-selected="${pane==='notes'}" data-act="pane" data-p="notes">배경 노트</button></div>
 <div class="grid2"><div class="pane ${pane==='text'?'show':''}"><p class="sub" style="padding:10px 16px 0;margin:0">구절을 누르면 ${S.lang==='en'?'개역한글':'BSB 영어 성경'}이 펼쳐지고, 개역개정, 우리말성경, ESV, NIV, 메시지 성경은 성경 사이트에서 열려요.</p>${list}<p class="mini" style="padding:12px 16px">${CREDIT}</p></div>
 <aside class="aside pane ${pane==='notes'?'show':''}" style="padding:14px 16px"><h2 style="font-size:15px;margin:0 0 4px">내 질문</h2>${myQs}<h2 style="font-size:15px;margin:18px 0 8px">이 본문의 배경</h2><div style="display:flex;flex-direction:column;gap:8px">${others||'<p class="sub" style="margin:0">이 본문의 배경 노트는 준비 중이에요.</p>'}</div></aside></div>`}

/* 3단계 */
function paraStarts(splits){return [FIRSTV()].concat(splits.slice().sort((a,b)=>a-b).map(n=>n+1))}
function step3(){const st=S.mine.steps[3];const starts=paraStarts(st.splits);let h='';
 VV().forEach(x=>{const v=x.v,t=mainT(x);const si=starts.indexOf(v);
  if(si>=0){const end=(starts[si+1]||LASTV()+1)-1;h+=`<div class="para"><span class="badge" style="font-weight:700">문단 ${si+1} · ${LBL(v)}${end>v?'-'+LBL(end):''}절</span><input type="text" data-bind="s3.title.${v}" placeholder="문단 제목" value="${esc(st.titles[v]||'')}"><input type="text" data-bind="s3.sum.${v}" placeholder="한두 줄 요약" value="${esc(st.sums[v]||'')}"></div>`}
  h+=`<p class="verse" style="font-size:16px"><span class="vn">${LBL(v)}</span>${markTerms(t,CONN().filter(c=>t.startsWith(c+' ')||t.includes(' '+c+' ')))}</p>`;
  if(v<LASTV())h+=`<div class="split ${st.splits.includes(v)?'on':''}"><button data-act="split" data-v="${v}" aria-pressed="${st.splits.includes(v)}">${st.splits.includes(v)?'여기서 나눔':'여기서 나누기'}</button></div>`});
 const n=starts.length;
 return `<div class="sec" style="border-bottom:0"><p class="sub" style="margin:0">구절 사이 점선을 누르면 문단이 나뉘어요. "그런데, 그러나, 이는" 같은 연결어가 표시되어 있어요.</p>${n>5?`<p class="note" style="margin:10px 0 0;font-size:13px">지금 문단이 ${n}개예요. 가이드는 3~5개를 권하지만, 나눈 이유가 있다면 그대로 두어도 좋아요.</p>`:''}</div>
 <div style="padding:0 18px">${h}</div>
 ${(()=>{const hs=VV().filter(x=>x.h);return (S.mine.steps[3].done||n>=3)&&hs.length?`<div class="sec"><h2>참고: BSB 영어 성경의 소제목</h2><p class="sub" style="margin:0 0 8px">내 문단 나누기와 견주어 보세요.</p>${hs.map(x=>`<div class="row" style="padding:4px 0;align-items:flex-start"><span class="sub" style="width:64px;flex-shrink:0">${x.label}절부터</span><span lang="en">${esc(x.h)}</span></div>`).join('')}</div>`:''})()}`}

/* 4단계 */
function step4(){const st=S.mine.steps[4];const a=S.ui.addGod;
 const verses=VV().map(x=>{const v=x.v,t=mainT(x);const es=st.entries.filter(e=>e.v===v);
  return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><p class="verse" style="font-size:16px"><span class="vn">${LBL(v)}</span>${markTerms(t,DIVN())}</p>
  ${es.map(e=>`<div class="row" style="padding:4px 0"><span class="chip" style="min-height:26px;font-size:12px">${e.who} ${e.kind}</span><span style="flex:1">${esc(e.text)}</span><button class="ic" data-act="delGod" data-id="${e.id}" aria-label="지우기">${IC.x()}</button></div>`).join('')}
  ${a===v?`<div style="display:flex;flex-direction:column;gap:8px;padding:8px 0"><div class="row" style="flex-wrap:wrap"><div class="seg" role="group" aria-label="성품 또는 사역">${['성품','사역'].map(x=>`<button data-act="godKind" data-val="${x}" aria-pressed="${S.ui.godKind===x}">${x}</button>`).join('')}</div><div class="seg" role="group" aria-label="누구">${['성부','성자','성령'].map(x=>`<button data-act="godWho" data-val="${x}" aria-pressed="${S.ui.godWho===x}">${x}</button>`).join('')}</div></div>
   <input type="text" data-bind="ui.godText" placeholder="${S.ui.godKind==='성품'?'예: 세상을 이처럼 사랑하시는 하나님':'예: 독생자를 주신 하나님'}"><div class="row"><button class="btn sm" data-act="addGod">기록하기</button><button class="btn sm ghost" data-act="cancelGod">취소</button></div></div>`
  :`<button class="chip" style="margin:4px 0" data-act="openGod" data-v="${v}">+ 하나님 발견</button>`}</div>`}).join('');
 return `<div class="sec" style="border-bottom:0"><p class="sub" style="margin:0">하나님, 예수, 성령, 인자 같은 표현이 표시되어 있어요. 주어를 하나님으로 놓고 성품(어떤 분이신가)과 사역(무엇을 하셨나)을 기록해요.</p></div><div style="padding:0 18px">${verses}</div><div class="sec">${godSummary(st.entries)}</div>`}
function godSummary(es){if(!es.length)return '<p class="sub" style="margin:0">기록하면 여기에 "이 본문에서 발견한 하나님"이 모여요.</p>';
 return `<h2>이 본문에서 발견한 하나님</h2>${['성품','사역'].map(kind=>{const g=es.filter(e=>e.kind===kind);return g.length?`<div style="margin-bottom:10px"><div class="sub">${kind}</div>${g.map(e=>`<div>${esc(e.text)} <span class="sub">${e.who}, ${LBL(e.v)}절</span></div>`).join('')}</div>`:''}).join('')}`}

/* 5단계 */
function step5(){const st=S.mine.steps[5];const all=VV().map(mainT).join(' ');const counts=STMS().map(([l,re])=>[l,(all.match(re)||[]).length]).filter(x=>x[1]>=2).sort((a,b)=>b[1]-a[1]);const max=counts[0]?counts[0][1]:1;
 const s3=S.mine.steps[3];const starts=paraStarts(s3.splits);
 return `<div class="sec"><h2>반복되는 말</h2><div style="display:flex;flex-direction:column;gap:6px">${counts.map(([l,n])=>`<div class="row"><span style="width:110px;font-size:14px">${l}</span><span style="height:8px;border-radius:4px;background:var(--fg);width:${Math.round(n/max*60)+4}%"></span><span class="sub">${n}</span></div>`).join('')}</div></div>
 <div class="sec"><h2>대조되는 짝</h2><div class="wrapRow">${(S.lang==='en'?PAIRS_EN:PAIRS).concat(st.pairs.filter(p=>!(S.lang==='en'?PAIRS_EN:PAIRS).includes(p))).map(p=>`<button class="chip ${st.pairs.includes(p)?'on':''}" data-act="pair" data-p="${esc(p)}" aria-pressed="${st.pairs.includes(p)}">${esc(p)}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input type="text" data-bind="ui.pairCustom" placeholder="직접 찾은 대조, 예: 밤 / 빛"><button class="btn sm ghost" data-act="addPair">추가</button></div></div>
 <div class="sec"><h2>앞에서 찾은 것</h2><div class="sub" style="margin-bottom:6px">3단계 문단</div>${starts.map(v=>`<div>${LBL(v)}절부터: ${esc(s3.titles[v]||'제목 없음')}</div>`).join('')}<div class="sub" style="margin:10px 0 6px">4단계 하나님</div>${S.mine.steps[4].entries.length?S.mine.steps[4].entries.map(e=>`<div>${esc(e.text)}</div>`).join(''):'<div class="sub">아직 기록이 없어요</div>'}</div>
 <div class="sec" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0">중심사상</h2><textarea data-bind="s5.idea" rows="4" placeholder="이 본문이 말하는 핵심을 자유롭게 써요">${esc(st.idea)}</textarea><label class="mini">한 문장으로 줄여보기<input type="text" data-bind="s5.one" value="${esc(st.one)}" placeholder="한 문장"></label></div>`}

/* 다른 지체의 연구 */
function sharedStepHTML(k,s){if(!s)return '';if(s.free)return `<p class="txt">${esc(s.free)}</p>`;
 if(k===1){const qs=s.qs||[];const memos=Object.entries(s.memos||{}).filter(x=>x[1]);const g=s.guide||{};return `${Object.values(g).some(Boolean)?`<div class="note" style="margin-bottom:10px">${[['who','누가'],['when','언제'],['where','어디서'],['what','무엇을']].filter(([f])=>g[f]).map(([f,l])=>`<div><span class="sub">${l}</span> ${esc(g[f])}</div>`).join('')}</div>`:''}${qs.map(q=>`<div class="bubble"><span class="pin">?</span><span class="t">${LBL(q.v)}절, ${esc(q.text)}</span></div>`).join('')}${memos.map(([v,m])=>`<div style="padding:8px 0"><span class="sub">${LBL(+v)}절</span><p class="txt">${esc(m)}</p></div>`).join('')}`||'<p class="sub">표시만 했어요</p>'}
 if(k===2){const m=Object.entries(s.memos||{}).filter(x=>x[1]);return m.length?m.map(([v,t])=>`<div style="padding:8px 0"><span class="sub">${LBL(+v)}절</span><p class="txt">${esc(t)}</p></div>`).join(''):'<p class="sub">메모가 없어요</p>'}
 if(k===3){const st=paraStarts(s.splits||[]);return st.map((v,i)=>`<div style="padding:6px 0"><b>문단 ${i+1} · ${LBL(v)}-${LBL((st[i+1]||LASTV()+1)-1)}절</b> ${esc((s.titles||{})[v]||'')}<div class="sub">${esc((s.sums||{})[v]||'')}</div></div>`).join('')}
 if(k===4)return godSummary(s.entries||[]);
 if(k===5)return `${s.one?`<p class="txt" style="font-weight:700">${esc(s.one)}</p>`:''}${s.idea?`<p class="txt">${esc(s.idea)}</p>`:''}${(s.pairs||[]).length?`<div class="wrapRow" style="margin-top:8px">${s.pairs.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div>`:''}`}
function viewMember(){const u=S.member;return `<div class="wrap"><div class="row hdrpad" style="padding:8px 4px"><button class="ic" data-act="go" data-v="home" aria-label="돌아가기">${IC.back()}</button>${avatar(u,40)}<div style="flex:1"><div class="who"><b>${esc(nameOf(u))}</b><span class="badge">${LEVELS[levelOf(u)]}</span></div><div class="sub">${PASSAGE.ref}${isDemo(u)?' · 샘플 지체':''}</div></div></div>${memberPanel(u)}</div>`}
function memberPanel(u){const st=studyOf(u);const k=S.ui.stepOf[u]||1;const myDone1=S.mine&&S.mine.steps[1].done;
 const tabs=`<div class="tablist" role="tablist" style="grid-template-columns:repeat(5,minmax(0,1fr))">${[1,2,3,4,5].map(i=>`<button role="tab" aria-selected="${k===i}" data-act="mstep" data-k="${i}">${i}단계</button>`).join('')}</div>`;

 <div class="post" style="padding-bottom:14px">${avatar(S.uid,36)}<div class="body" style="gap:8px">${S.ui.composerSrc&&pk==='share'?`<span class="sub">${esc(S.ui.composerSrc)}에서 가져왔어요</span>${S.mine?(()=>{const ks=[1,2,3,4].filter(k=>hasContent(S.mine,k)&&(shareText(k)||'').trim());return ks.length?`<div style="display:flex;flex-direction:column;gap:6px"><span class="mini">이번 주 연구에서 더 담기</span><div class="wrapRow">${ks.map(k=>{const on=(S.ui.shareAdded||{})[k];return `<button class="chip ${on?'on':''}" data-act="shareAdd" data-k="${k}" ${on?'disabled':''}>${on?'✓ ':'+ '}${k}단계 ${['','질문과 메모','번역 메모','문단','하나님'][k]}</button>`}).join('')}</div></div>`:''})():''}`:''}<textarea id="composer" data-bind="ui.composer" rows="3" placeholder="${pk==='prayer'?'지체들과 함께 기도하고 싶은 제목을 나눠요':'말씀에서 받은 은혜를 나눠요'}">${esc(S.ui.composer)}</textarea>

/* 과정 전체 보기 */
function myProg(id){if(S.mine&&SES().id===id){const p=progressOf(S.mine);return p}const it=(S.items[S.uid]||{})['study-'+gKey(id)];return it&&it.progress||null}
function progCount(p){return p?Object.values(p).filter(x=>x==='done').length:0}
function sessionDates(){const sch=schedule();const ci=periodIndex(sch,todayIn(sch.tz));const m={};for(let n=ci-60;n<=ci+60;n++){const se=sessionOf(sch,nthPeriod(sch,n));if(se.no&&!m[se.no])m[se.no]={start:se.start,end:se.end,n}}return{m,ci}}
function viewCourse(){const {m,ci}=sessionDates();const cur=curSession();const today=todayIn(schedule().tz);
 const rows=CURR_KO.map((t,i)=>{const no=i+1;const id='s'+no;const p=myProg(id);const dn=progCount(p);const started=p&&Object.values(p).some(x=>x!=='none');const dt=m[no];const isCur=cur.no===no;
  const st=dn===5?'done':isCur?'cur':started?'doing':(dt&&dt.start>today)?'next':(dt&&dt.end<today)?'past':'none';
  const mark=st==='done'?`<span style="width:30px;height:30px;border-radius:15px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700" aria-label="완료">✓</span>`
   :st==='cur'?`<span style="width:30px;height:30px;border-radius:15px;border:2px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${no}</span>`
   :`<span style="width:30px;height:30px;border-radius:15px;border:1px solid var(--line2);color:${st==='doing'?'var(--fg)':'var(--mut)'};display:flex;align-items:center;justify-content:center;font-size:12px">${no}</span>`;
  const tag=st==='done'?'<span class="badge">완료</span>':st==='cur'?`<span class="badge">이번 세션${started?' · '+dn+'/5':''}</span>`:st==='doing'?`<span class="sub">작성 중 ${dn}/5</span>`:st==='next'?`<span class="sub">${fmtD(dt.start)} 시작</span>`:st==='past'?'<span class="sub">지나간 세션</span>':'';
  const open=st==='done'||st==='doing'||st==='cur';
  const inner=`${mark}<div style="flex:1;min-width:0"><div style="font-weight:${isCur?700:500}${st==='none'||st==='next'||st==='past'?';color:var(--mut)':''}">${esc(t)}</div><div class="sub">${esc(refsLabel(CURR_REFS[i]))}${dt?' · '+fmtD(dt.start)+' ~ '+fmtD(dt.end):''}</div></div>${tag}`;
  return open?`<button data-act="openNo" data-no="${no}" style="display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 16px;text-align:left;color:inherit">${inner}${IC.next()}</button>`:`<div style="display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 16px">${inner}</div>`}).join('');
 const doneN=CURR_KO.filter((t,i)=>progCount(myProg('s'+(i+1)))===5).length;
 const extra=Object.entries(S.items[S.uid]||{}).filter(([id,it])=>it.type==='study'&&/^study-(.+\.)?c\d/.test(id)).sort((a,b)=>(b[1].start||'').localeCompare(a[1].start||''));
 return `<div class="wrap"><div class="row hdrpad" style="padding:8px 4px"><button class="ic" data-act="go" data-v="journey" aria-label="돌아가기">${IC.back()}</button><div style="flex:1"><div style="font-weight:700;font-size:17px">${GROUPS[0]} 과정</div><div class="sub">창조에서 그리스도까지, 28개 세션</div></div></div>
 <div class="sec" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><span><b style="font-size:22px">${doneN}</b><span class="sub"> / 28 세션 완료</span></span><span class="sub">${cur.no?'지금 세션 '+cur.no:'지금은 리더가 정한 본문'}</span></div><div class="bars">${CURR_KO.map((t,i)=>{const n=i+1;const dn=progCount(myProg('s'+n));return `<span class="${dn===5?'done':cur.no===n?'doing':''}"></span>`}).join('')}</div>
 <div class="row mini" style="gap:14px;flex-wrap:wrap"><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:6px;background:var(--acc)"></span>완료</span><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:6px;border:2px solid var(--acc)"></span>이번 세션</span><span class="row" style="gap:5px"><span style="width:12px;height:12px;border-radius:6px;border:1px solid var(--line2)"></span>아직</span></div></div>
 <div>${rows}</div>
 ${extra.length?`<div class="sec" style="border-bottom:0"><h2>커리큘럼 밖에서 연구한 본문</h2>${extra.map(([id,it])=>{const dn=progCount(it.progress);return `<button data-act="openCustom" data-id="${esc(id.slice(6).split('.').pop())}" style="display:flex;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0;text-align:left;color:inherit"><div style="flex:1"><div style="font-weight:500">${esc(it.label||it.title||'리더가 정한 본문')}</div><div class="sub">${it.start?fmtD(it.start)+' 세션':''}</div></div><span class="sub">${dn}/5</span>${IC.next()}</button>`}).join('')}</div>`:''}
 </div>`}


/* 말씀 지도 */
const BOOK_START=(()=>{let a=0;return BOOKS.map(b=>{const x=a;a+=b[2];return x})})();
const TOTAL_CH=BOOKS.reduce((a,b)=>a+b[2],0);
function studiesOf(uid){const out=[];const m=S.items[uid]||{};
 Object.entries(m).forEach(([id,it])=>{if(it.type!=='study'||!id.startsWith('study-'))return;const sid=id.slice(6).split('.').pop();let refs=it.refs;
  if(!refs){if(/^s\d+$/.test(sid))refs=CURR_REFS[+sid.slice(1)-1];else{const cu=schedule().custom[sid.slice(1)];refs=cu&&cu.refs}}if(!refs||!refs.length)return;
  let prog=it.progress;if(uid===S.uid&&S.mine&&SES().id===sid)prog=progressOf(S.mine);if(!prog||!Object.values(prog).some(x=>x!=='none'))return;
  out.push({sid,refs,dn:progCount(prog),title:it.title||(/^s\d+$/.test(sid)?(isEN()?CURR:CURR_KO)[+sid.slice(1)-1]:refsLabel(refs)),label:refsLabel(refs)})});
 if(uid===S.uid&&S.mine&&SES().id&&!m['study-'+SES().id]&&SES().refs){const p=progressOf(S.mine);if(Object.values(p).some(x=>x!=='none'))out.push({sid:SES().id,refs:SES().refs,dn:progCount(p),title:SES().title,label:SES().label})}
 return out}
function chaptersOf(refs){const set=new Set();refs.forEach(([b,c1,v1,c2])=>{const bi=BOOKS.findIndex(x=>x[0]===b);if(bi<0)return;for(let c=c1;c<=c2;c++)set.add(BOOK_START[bi]+c-1)});return [...set]}
function bibleMap(mode){const W=400,P=8,rowH=86;const ends=i=>i<66?BOOK_START[i]:TOTAL_CH;
 const rows=[{name:'구약',from:0,to:39,bands:[['율법서',0,5],['역사서',5,17],['시가서',17,22],['선지서',22,39]]},{name:'신약',from:39,to:66,bands:[['복음서',39,43],['행전',43,44],['서신서',44,65],['계시록',65,66]]}];
 const pts={};const uids=mode==='group'?members():[S.uid];
 uids.forEach(u=>studiesOf(u).forEach(st=>chaptersOf(st.refs).forEach(ci=>{(pts[ci]=pts[ci]||[]).push({u,dn:st.dn,label:st.label})})));
 let g='';rows.forEach((r,ri)=>{const c0=ends(r.from),c1=ends(r.to),span=c1-c0;const top=ri*rowH;const base=top+52;const X=ci=>P+(ci-c0+0.5)/span*(W-2*P);const BX=ci=>P+(ci-c0)/span*(W-2*P);
  const studied=Object.keys(pts).filter(k=>k>=c0&&k<c1).length;
  g+=`<text x="${P}" y="${top+12}" style="fill:var(--fg);font-size:12px;font-weight:700">${r.name}</text><text x="${W-P}" y="${top+12}" text-anchor="end" style="fill:var(--mut);font-size:11px">${studied} / ${span}장</text>`;
  r.bands.forEach(([n,a,b],bi)=>{const x1=BX(ends(a)),x2=BX(ends(b));g+=`<rect x="${x1.toFixed(1)}" y="${base+3}" width="${Math.max(1,x2-x1-1).toFixed(1)}" height="6" rx="1.5" style="fill:${bi%2?'var(--line2)':'var(--soft2)'}"/>`;if(x2-x1>26)g+=`<text x="${((x1+x2)/2).toFixed(1)}" y="${base+22}" text-anchor="middle" style="fill:var(--mut);font-size:10px">${n}</text>`});
  for(let i=r.from;i<r.to;i++){const x=BX(ends(i));g+=`<line x1="${x.toFixed(1)}" y1="${base+2}" x2="${x.toFixed(1)}" y2="${base+10}" style="stroke:var(--bg);stroke-width:.6"/>`}
  Object.entries(pts).forEach(([k,list])=>{k=+k;if(k<c0||k>=c1)return;const x=X(k).toFixed(1);const bi=BOOK_START.findIndex((st,i)=>k>=st&&k<ends(i+1));const ch=k-BOOK_START[bi]+1;const tip=isEN()?`${bookName(BOOKS[bi][0])} ${ch}`:`${BOOKS[bi][1]} ${ch}장`;

const INTRO_DEFAULT="## 말씀을 먹고 사는 하나님의 자녀\n모든 믿는 사람은 하나님의 말씀인 성경을 먹고 살아야 합니다. 하나님의 자녀가 아버지의 말씀으로 영혼을 기르는 것은 너무나 자연스러운 일입니다. 그러나 성경에 대한 여러 오해와 잘못된 접근이 그리스도인의 삶에서 가장 중요한 이 부분을 가로막곤 합니다.\n세상 속에서 빛의 자녀로 부름받은 우리가 말씀을 먹지 않으면, 영적인 배고픔과 목마름 속에서 하나님의 자녀 된 기쁨을 누리지 못한 채 가난한 영혼으로 살아가게 됩니다.\n## 생명을 주는 영혼의 양식\n하나님의 자녀 된 정체성을 온전히 누리려면 모든 성도가 말씀을 먹어야 합니다. 성경은 생명을 주는 영혼의 양식입니다. 그리고 우리는 성경을 통해 어두운 세상 속에서 밝게 빛나는 빛의 자녀로 살아갈 힘을 얻습니다.\n## 바이블 온에어 성경연구 공동체\n바이블 온에어(BOA) 성경연구 공동체는 시간과 장소의 한계를 넘어, 누구든지 어디서나 성경을 연구하고 말씀을 통해 하나님의 자녀로서 풍성한 삶을 누리도록 돕는 성경연구 모임입니다.\n성경을 처음 접하는 분이든 오랫동안 공부해 온 분이든, 바이블 온에어는 모두를 똑같이 환영합니다. 우리는 함께 말씀을 읽고, 연구하고, 나누며, 성경에 드러난 하나님의 뜻을 온전히 깨닫도록 서로 돕습니다.\n## 이렇게 함께합니다\n- 매주 정해진 본문 하나에 집중합니다.\n- 체계적인 성경연구 방법으로 날마다 본문을 연구합니다.\n- 온라인 공동 연구 도구로 깨달음과 묵상을 나눕니다.\n- 온라인 또는 오프라인 모임에서 말씀이 주는 풍성한 은혜를 함께 누립니다.";

const INTRO_EN="## Children of God who feed on the Word\nAll believers must feed on the Word of God, the Bible. As children of God, it is only natural that we nourish ourselves with His Word. However, many misunderstandings and incorrect approaches to the Bible often hinder this essential part of the Christian life.\nIf we, who are called to live as children of light in this world, do not feed on the Word, we will live in spiritual hunger and thirst, missing out on the joy of being God's children and living in spiritual poverty.\n## Spiritual nourishment that brings life\nTo truly enjoy our identity as God's children, every believer must feed on the Word of God. The Bible is our spiritual nourishment that brings life. Moreover, through the Bible, we are empowered to live as children of light, shining brightly in a dark world.\n## The BOA Bible Study Community\nThe BOA Bible Study Community is a Bible study fellowship that transcends the limitations of time and place, enabling anyone, anywhere, to study the Bible and enjoy the abundant life of a child of God through His Word.\nWhether you are new to the Bible or have studied it for years, BOA Bible Study welcomes everyone equally. Together, we read, study, and share the Word, helping one another fully grasp God's intentions revealed through Scripture.\n## How we study together\n- Each week, we focus on a designated passage.\n- Members study it daily using a structured Bible study methodology.\n- Through online collaboration tools, we share insights and reflections.\n- We gather in online or offline meetings to experience the richness of God's grace through His Word.";

function setPath(obj,parts,val){let o=obj;for(let i=0;i<parts.length-1;i++){if(o[parts[i]]==null)o[parts[i]]={};o=o[parts[i]]}o[parts[parts.length-1]]=val}
document.addEventListener('input',e=>{const el=e.target;const b=el.dataset&&el.dataset.bind;if(!b)return;const [ns,...rest]=b.split('.');const val=el.value;
 if(ns==='ui'){if(rest.length>1){if(S.ui[rest[0]])S.ui[rest[0]][rest[1]]=val;return}S.ui[rest[0]]=val;return}
 if(ns==='hd'){if(!S.ui.hd)return;setPath(S.ui.hd,rest.map(x=>/^\d+$/.test(x)?+x:x),val);return}
 if(ns==='cmt'){S.ui.cmt[rest.join('.')]=val;return}
 const m=ns.match(/^s(\d)$/);if(!m||!S.mine)return;const step=S.mine.steps[+m[1]];
 if(rest[0]==='memo')step.memos[rest[1]]=val;else if(rest[0]==='guide')step.guide[rest[1]]=val;else if(rest[0]==='title')step.titles[rest[1]]=val;else if(rest[0]==='sum')step.sums[rest[1]]=val;else step[rest[0]]=val;
 persistMine();setSave()});
document.addEventListener('change',e=>{const el=e.target;const a=el.dataset&&el.dataset.actChange;
 if(el.dataset&&el.dataset.bind==='ui.scope'){S.ui.scope=el.value;return}
 if(el.dataset&&el.dataset.bind==='ui.joinG'){S.ui.joinG=el.value;return}
 if(el.dataset&&el.dataset.bind==='ui.joinOther'){S.ui.joinOther=el.value;return}
 if(a==='level'){const u=el.dataset.u;saveMem(u,S.g,{level:+el.value,levelAt:Date.now()});render()}
 if(a==='signAgree'){S.ui.signAgree=el.checked;if(el.checked&&S.ui.signErr.agree){delete S.ui.signErr.agree;render()}return}
 if(a==='hdFile'){const f=el.files&&el.files[0];uploadVideo(+el.dataset.i,f);el.value='';return}
 if(a==='picFile'){const f=el.files&&el.files[0];S.ui.picMenu=null;setMyPicture(el.dataset.kind,f);el.value='';return}
 if(a==='adminAdd'){const u=el.value;if(!u)return;if(!confirm(`${nameOf(u)}님을 관리자로 지정할까요?`)){el.value='';return}saveMem(u,S.g,{role:'admin'});render();return}
 if(a==='gsCheck'){if(S.ui.gs)S.ui.gs[el.dataset.f]=el.checked;return}
 if(a==='schNo'){schDraft().curNo=+el.value;render();return}
 if(a==='schDays'){schDraft().days=Math.max(1,Math.min(365,+el.value||1));render();return}
 if(a==='schAnchor'){schDraft().anchor=el.value;render();return}
 if(a==='schTz'){schDraft().tz=el.value;render();return}
 if(a==='rng'){const f=el.dataset.f;S.ui.rng[f]=f==='b'?el.value:Math.max(1,parseInt(el.value,10)||1);if(f==='b'){S.ui.rng.c1=1;S.ui.rng.v1=1;S.ui.rng.c2=1;S.ui.rng.v2=10}if(f==='c1'&&S.ui.rng.c2<S.ui.rng.c1)S.ui.rng.c2=S.ui.rng.c1;S.ui.rngErr='';render();return}
 if(a==='hide1'){saveGroup(S.g,{hideStep1:el.checked});render()}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault()});

document.addEventListener('loadedmetadata',e=>{const v=e.target;if(!v.dataset||!v.dataset.vid)return;const p=(S.hubMine.pos||{})[v.dataset.vid];if(p&&v.duration&&p<v.duration*0.95)try{v.currentTime=p}catch(x){}},true);
function trackProgress(id,t,d){if(!id||!d)return;const pos=Object.assign({},S.hubMine.pos||{},{[id]:Math.floor(t)});const w=Object.assign({},S.hubMine.watched||{});let newly=false;if(t>=d*0.9&&!w[id]){w[id]=true;newly=true}
 S.hubMine=Object.assign({},S.hubMine,{pos,watched:w});if(!S.readOnly)save(hubMinePath(),isDemo(S.uid)?Object.assign({type:'private'},S.hubMine):S.hubMine,newly?0:4000);if(newly)scheduleRender()}
document.addEventListener('timeupdate',e=>{const v=e.target;if(!v.dataset||!v.dataset.vid||!v.duration)return;trackProgress(v.dataset.vid,v.currentTime,v.duration)},true);
/* 유튜브: 실제 앱에서는 앱 안에서 재생 (테스트 앱은 보안 규칙상 새 창) */
function ytId(u){u=String(u||'').trim();const m=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
const YT_INLINE=DEPLOYED;
let ytApi=null;function loadYT(){if(ytApi)return ytApi;ytApi=new Promise(res=>{if(window.YT&&window.YT.Player)return res(window.YT);const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)prev();res(window.YT)};const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;sc.onerror=()=>{ytApi=null;res(null)};document.head.appendChild(sc);setTimeout(()=>res(window.YT&&window.YT.Player?window.YT:null),10000)});return ytApi}
const ytPlayers={};
async function playYT(id,yt){const wrap=[...document.querySelectorAll('.ytwrap[data-vid]')].find(x=>x.dataset.vid===id);if(!wrap)return;wrap.dataset.active='1';wrap.innerHTML='<div class="ytslot" style="width:100%;height:100%"></div>';
 const Y=await loadYT();const v=HUB().videos.find(x=>x.id===id)||{};
 if(!Y){wrap.removeAttribute('data-active');window.open(v.url,'_blank','noopener');render();return}
 const start=Math.floor((S.hubMine.pos||{})[id]||0);const watched=!!(S.hubMine.watched||{})[id];
 const pl=new Y.Player(wrap.querySelector('.ytslot'),{host:'https://www.youtube-nocookie.com',videoId:yt,width:'100%',height:'100%',playerVars:{autoplay:1,playsinline:1,rel:0,modestbranding:1,start:watched?0:start},
  events:{onReady:e=>{try{e.target.playVideo()}catch(x){}},onStateChange:e=>{if(e.data===0){try{trackProgress(id,e.target.getDuration(),e.target.getDuration())}catch(x){}}}}});
 if(ytPlayers[id]&&ytPlayers[id].timer)clearInterval(ytPlayers[id].timer);
 ytPlayers[id]={pl,timer:setInterval(()=>{try{if(!document.body.contains(wrap)){clearInterval(ytPlayers[id].timer);return}if(pl.getPlayerState&&pl.getPlayerState()===1)trackProgress(id,pl.getCurrentTime(),pl.getDuration())}catch(x){}},5000)}}

function go(v){S.ui.picMenu=null;S.ui.settingsOpen=false;if(v==='hub'&&S.view!=='hub')markHubSeen();if(S.viewSes&&v!=='member'){S.viewSes=null;mineSid=null;loadMine()}S.view=v;S.ui.tool=null;S.ui.openVerse=null;window.scrollTo(0,0);render();window.scrollTo(0,0)}
async function act(a,d){const st=S.mine;
 switch(a){
 case 'go':go(d.v);break;
 case 'introToggle':S.ui.introOpen=!S.ui.introOpen;render();break;
 case 'openIdea':{const u=d.u;S.homeUid=u;if(u===S.uid)S.step=5;else{S.member=u;S.ui.stepOf[u]=5}go('home');setTimeout(()=>scrollToPanel(true),30);break}

 case 'installBg':

 case 'installNever':try{localStorage.setItem('boa-install','never')}catch(e){}closeInstall();break;
 case 'installHelp':S.ui.settingsOpen=false;render();openInstall();break;
 case 'installKakao':location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);break;
 case 'adminRemove':{const u=d.u;if(!confirm(`${nameOf(u)}님의 관리자 지정을 해제할까요?`))break;saveMem(u,S.g,{role:'member'});render();break}
 case 'lang':S.lang=d.val==='en'?'en':'ko';try{localStorage.setItem('boa-lang',S.lang)}catch(e){}S.ui.tool=null;S.ui.qDraft=null;render();break;
 case 'uiLang':setUiLang(d.val);break;
 case 'sgMenu':S.ui.sgMenu=!S.ui.sgMenu;render();break;
 case 'sgPick':{const g=d.g;S.ui.sgMenu=false;if(g===S.g){render();break}S.g=g;rememberG();recompute();S.homeUid=S.uid;S.ui.stepOf={};S.step=1;S.ui.sch=null;S.viewSes=null;mineSid=null;S.mine=null;loadMine();render();break}
 case 'gCreate':{const nm=(S.ui.newG||'').trim().slice(0,40);if(!nm||!isOps())break;const id='g'+rid();G.groups[id]={name:nm,schedule:newSchedule(),hideStep1:true,at:Date.now(),by:S.uid};save('groups/'+id,G.groups[id],0);S.ui.newG='';S.g=id;rememberG();recompute();S.homeUid=S.uid;S.step=1;S.viewSes=null;mineSid=null;S.mine=null;loadMine();render();break}
 case 'copyInvite':{const link=inviteLink(d.g);const done=()=>{S.ui.copied=d.g;render();setTimeout(()=>{S.ui.copied=null;render()},2500)};try{navigator.clipboard.writeText(link).then(done,()=>{prompt('초대 링크',link)})}catch(e){prompt('초대 링크',link)}break}
 case 'joinInvite':{sendJoin(INVITE,{displayName:nameOf(S.uid)});clearInvite();render();break}
 case 'dismissInvite':clearInvite();render();break;
 case 'joinOther':{const g=S.ui.joinOther;if(!g)break;sendJoin(g,{displayName:nameOf(S.uid)});S.ui.joinOther='';render();break}
 case 'cancelJoin':dropReq(S.uid,d.g);render();break;
 case 'gqOpen':S.ui.gq=Object.assign({},S.ui.gq,{open:d.val==='1'});render();break;
 case 'gqToggle':S.ui.gqShow=!S.ui.gqShow;S.ui.gqErr='';render();break;

 case 'gqAgain':S.ui.gqAgain=true;S.ui.gq=null;render();break;
 case 'finderToggle':S.ui.finder=!S.ui.finder;render();break;
 case 'gqSend':{if(!canRequestGroup())break;const q=S.ui.gq||{};const name=(q.name||'').trim().slice(0,40);if(!name){S.ui.gqErr=isEN()?'Please enter a group name':'그룹 이름을 넣어 주세요';render();break}if(S.readOnly)break;
  const id=memKey(S.uid,'r'+rid());const x={uid:S.uid,name,intro:(q.intro||'').trim().slice(0,400),open:q.open!==false,mode:q.mode||'',when:String(q.when||'').trim().slice(0,60),lang:q.lang||'',displayName:(S.ui.signName||'').trim()||nameOf(S.uid),at:Date.now(),status:'pending'};
  G.greqs[id]=x;save('greqs/'+id,x,0);S.ui.gq=null;S.ui.gqShow=false;S.ui.gqErr='';S.ui.gqAgain=false;render();break}

function installPref(){try{return localStorage.getItem('boa-install')||''}catch(e){return ''}}
function maybeAskInstall(){if(!DEPLOYED||!ENVI.mobile||isStandalone()||IS.open)return;const p=installPref();if(p==='never'||p==='done')return;if(p.startsWith('later:')&&Date.now()<+p.slice(6))return;openInstall()}
function openInstall(){IS.open=true;renderInstall()}
function closeInstall(){IS.open=false;renderInstall()}
const ICON_SHARE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
const ICON_PLUS='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';
function renderInstall(){const el=document.getElementById('installSheet');if(!el)return;if(!IS.open){el.innerHTML='';return}
 const head=`<div style="display:flex;gap:14px;align-items:center"><img src="${DEPLOYED?'/icons/icon-192.png':''}" alt="" width="52" height="52" style="border-radius:12px;background:#000;${DEPLOYED?'':'display:none'}"><div><b style="font-size:17px">${isEN()?'Add Bible On Air to your Home Screen':'바이블온에어를 홈 화면에 추가해요'}</b><div class="sub" style="font-size:14px">${isEN()?'It opens like an app, full screen without the address bar':'앱처럼 한 번에 열리고, 주소창 없이 넓게 보여요'}</div></div></div>`;
 let body='';
 if(ENVI.inapp){body=ENVI.kakao
   ?`<p style="margin:0;font-size:15px">${isEN()?`Home Screen can't be added inside KakaoTalk. Please open this in ${ENVI.ios?'Safari':'Chrome'} first.`:`카카오톡 안에서 열면 홈 화면에 추가할 수 없어요. 먼저 ${ENVI.ios?'사파리':'크롬'}로 열어 주세요.`}</p><button class="btn block" data-act="installKakao">${isEN()?'Open in '+(ENVI.ios?'Safari':'Chrome'):(ENVI.ios?'사파리':'크롬')+'로 열기'}</button>`
   :`<p style="margin:0;font-size:15px">${isEN()?'Home Screen can\'t be added in this in-app browser. Tap the <span class="key">⋯</span> menu at top right and choose <b>Open in browser</b>.':'이 앱 안의 브라우저에서는 홈 화면에 추가할 수 없어요. 오른쪽 위 <span class="key">⋯</span> 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러 주세요.'}</p>`}
 else if(ENVI.android&&installEvt){body=`<button class="btn block" data-act="installGo">${ICON_PLUS} ${isEN()?'Add to Home Screen':'홈 화면에 추가'}</button>`}
 else if(ENVI.ios){body=`<ol><li><span class="num">1</span><span>${isEN()?`Tap the <span class="key">${ICON_SHARE} Share</span> button at the bottom`:`화면 아래 가운데의 <span class="key">${ICON_SHARE} 공유</span> 버튼을 눌러요`}</span></li><li><span class="num">2</span><span>${isEN()?`Scroll up and tap <span class="key">${ICON_PLUS} Add to Home Screen</span>`:`목록을 올려서 <span class="key">${ICON_PLUS} 홈 화면에 추가</span>를 눌러요`}</span></li><li><span class="num">3</span><span>${isEN()?'Tap <b>Add</b> at top right and you\'re done':'오른쪽 위 <b>추가</b>를 누르면 끝이에요'}</span></li></ol><p class="mini" style="margin:0">${isEN()?'If you can\'t see the Share button, scroll down a little. In Chrome, use the Share button next to the address bar.':'공유 버튼이 안 보이면 화면을 살짝 아래로 내려 보세요. 크롬을 쓰신다면 주소창 오른쪽의 공유 버튼에서 똑같이 할 수 있어요.'}</p>`}
 else{body=`<ol><li><span class="num">1</span><span>${isEN()?'Tap the <span class="key">⋮</span> menu at top right':'오른쪽 위 <span class="key">⋮</span> 메뉴를 눌러요'}</span></li><li><span class="num">2</span><span>${isEN()?'Tap <b>Add to Home screen</b> or <b>Install app</b>':'<b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러요'}</span></li><li><span class="num">3</span><span>${isEN()?'Tap <b>Add</b> and you\'re done':'<b>추가</b>를 누르면 끝이에요'}</span></li></ol>`}
 el.innerHTML=`<div class="isheet-bg" data-act="installBg" role="presentation"><div class="isheet" role="dialog" aria-modal="true" aria-label="홈 화면에 추가">${head}${body}<div class="row" style="justify-content:space-between"><button data-act="installNever" style="border:0;background:none;color:var(--mut);font-size:13px;padding:8px 0">다시 보지 않기</button><button class="btn sm ghost" data-act="installLater">나중에</button></div></div></div>`;tr(el)}

/* ---------- 시작 ---------- */
const subs={};
function subItems(uid){if(subs['i-'+uid])return;subs['i-'+uid]=DB.collection(`pub/${uid}/items`).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});if(uid===S.uid){Object.keys(S.items[uid]||{}).forEach(id=>{if(!m[id]&&pend.has(itemPath(uid,id))&&pend.get(itemPath(uid,id))!==null)m[id]=S.items[uid][id]})}S.items[uid]=m;refreshProfiles();scheduleRender()},()=>{})}
setTimeout(()=>{if(!S.ready&&S.uid){S.ready=true;render()}},6000);
async function boot(){if(DEPLOYED){const ok=await BOA_AUTH.ready();if(!ok){S.authMode=true;S.ready=true;render();return}S.ui.sign='profile'}let db=null;try{db=await claude.use('db')}catch(e){db=null}try{USER=await claude.use('user')}catch(e){USER=null}
 let uid=null;if(db&&USER){uid=await USER.id()}
 if(!db||!uid){DB=makeLocalDB();S.local=true;S.uid='local-me';S.canEdit=true;S.realCanEdit=true}
 else{DB=db;S.uid=uid;S.canEdit=await USER.canEdit();S.realCanEdit=S.canEdit;const w=await USER.can('data.write');if(w===false)S.readOnly=true}
 S.realUid=S.uid;
 if(USER&&USER.me){try{const me=await USER.me();S.myEmail=(me&&me.email)||''}catch(e){}}
 DB.doc('config/hub').onSnapshot(s=>{S.hub=s.exists?s.data():null;if(S.view==='hub'&&unreadNotices())markHubSeen(true);syncAppBadge();scheduleRender()},()=>{});
 (async()=>{try{const m=await DB.doc(hubMinePath()).get();if(m.exists)S.hubMine=Object.assign({watched:{}},m.data())}catch(e){}scheduleRender()})();
 G.ops=!!S.realCanEdit;S.g=recallG();
 const coll=async name=>{try{const r={};(await DB.collection(name).get()).docs.forEach(d=>r[d.id]=d.data());return r}catch(e){return {}}};
 G.groups=await coll('groups');
 if(!Object.keys(G.groups).length&&isOps()&&!S.readOnly){if(await migrateLegacy())G.groups=await coll('groups')}
 [G.mems,G.reqs,G.greqs,G.codes,G.cm,G.cr,G.pinfo]=await Promise.all(['memberships','joinreqs','greqs','gcodes','approvals','requests','pinfo'].map(coll));
 recompute();await loadMine();
 const live=(name,key,after)=>DB.collection(name).onSnapshot(sn=>{const m={};sn.docs.forEach(d=>m[d.id]=d.data());G[key]=m;const before=SES().id;recompute();if(after)after(before);refreshProfiles();scheduleRender()},()=>{});
 live('groups','groups',before=>{if(!S.viewSes&&SES().id!==before){mineSid=null;loadMine()}});live('memberships','mems');live('joinreqs','reqs');live('greqs','greqs');live('gcodes','codes');live('approvals','cm');live('requests','cr');live('pinfo','pinfo');
 if(inApp()&&!myGroups().length&&!isOps()){let seen=null;try{seen=localStorage.getItem('boa-welcomed:'+S.uid)}catch(e){}if(!seen){S.view='hub';try{localStorage.setItem('boa-welcomed:'+S.uid,'1')}catch(e){}}}
 if(INVITE&&myGroups().includes(INVITE))clearInvite();
 refreshProfiles();S.ready=true;render();
 if(USER){try{const p=await USER.profiles([S.uid]);S.profiles=Object.assign({},S.profiles,p);if(!S.ui.signName&&p[S.uid]&&p[S.uid].name){S.ui.signName=p[S.uid].name;if(!inApp())render()}}catch(e){}}
 setTimeout(()=>{if(!S.ready){S.ready=true;render()}},4000)}
async function switchPersona(u){[...pend.keys()].forEach(k=>{clearTimeout(timers[k]);flush(k)});
 S.persona=u;S.uid=u||S.realUid;S.g=recallG();recompute();S.ui.tool=null;S.ui.openVerse=null;S.ui.qDraft=null;
 let me=null;try{me=await DB.doc(privPath()).get()}catch(e){}
 if(me&&me.exists)S.mine=Object.assign(blankStudy(),me.data());
 else{const b=blankStudy();const sh=u&&(S.items[u]||{})[SID()];if(sh){b.vis=Object.assign(b.vis,sh.vis||{});Object.entries(sh.shared||{}).forEach(([k,v])=>{b.steps[k]=Object.assign(b.steps[k],clone(v))});Object.entries(sh.progress||{}).forEach(([k,v])=>{if(v==='done')b.steps[k].done=true})}b.created=Date.now();S.mine=b}
 mineSid=SES().id;S.hubMine={watched:{}};S.ui.prevSeen=null;try{const hm=await DB.doc(hubMinePath()).get();if(hm.exists)S.hubMine=Object.assign({watched:{}},hm.data())}catch(e){}S.view='home';window.scrollTo(0,0);render()}
function getTheme(){try{return localStorage.getItem('boa-theme')||'auto'}catch(e){return 'auto'}}
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-boa-theme',t);else r.removeAttribute('data-boa-theme');try{localStorage.setItem('boa-theme',t)}catch(e){}}
applyTheme(getTheme());
/* 형광펜 색과 진하기 (기기마다 기억해요) */
const HL_COLORS={yellow:['노랑','#FFD43B'],green:['초록','#69DB7C'],blue:['하늘','#4DABF7'],pink:['분홍','#F783AC'],orange:['주황','#FFA94D']};
const HL_DEF={person:'blue',place:'green',rep:'yellow',light:35,dark:85};
function getHL(){try{return Object.assign({},HL_DEF,JSON.parse(localStorage.getItem('boa-hl')||'{}'))}catch(e){return Object.assign({},HL_DEF)}}
function setHL(patch){const h=Object.assign(getHL(),patch);try{localStorage.setItem('boa-hl',JSON.stringify(h))}catch(e){}applyHL()}
function isDarkNow(){const t=document.documentElement.getAttribute('data-boa-theme');if(t)return t==='dark';try{return window.matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}}
function applyHL(){const h=getHL();const dark=isDarkNow();const a=Math.max(15,Math.min(100,+(dark?h.dark:h.light)||0))/100;const r=document.documentElement.style;
 const rgba=hex=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
 r.setProperty('--per',rgba((HL_COLORS[h.person]||HL_COLORS.blue)[1]));r.setProperty('--pla',rgba((HL_COLORS[h.place]||HL_COLORS.green)[1]));r.setProperty('--rep',rgba((HL_COLORS[h.rep]||HL_COLORS.yellow)[1]));
 if(dark&&a>=0.5)r.setProperty('--hlText','#111');else r.removeProperty('--hlText')}
applyHL();try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyHL)}catch(e){}
function hlPanelHTML(withClose){const h=getHL();const dark=isDarkNow();const row=(k,l)=>`<div class="row" style="gap:8px;flex-wrap:wrap"><span style="width:44px;font-size:14px">${l}</span>${Object.entries(HL_COLORS).map(([c,[n,hex]])=>`<button class="sw" data-act="hlColor" data-k="${k}" data-c="${c}" aria-pressed="${h[k]===c}" aria-label="${l} ${n}" title="${n}" style="background:${hex}"></button>`).join('')}</div>`;
 return `<b style="font-size:14px">형광펜</b>${row('person','인물')}${row('place','장소')}${row('rep','반복')}
  <label class="mini" style="display:flex;flex-direction:column;gap:6px">${dark?'어두운 화면':'밝은 화면'} 진하기<input class="hlrange" type="range" min="15" max="100" step="5" value="${dark?h.dark:h.light}" data-act-input="hlStrength" aria-label="형광펜 진하기"></label>
  <div style="font-size:16px;line-height:2" data-noi18n><span class="w person">${isEN()?'Nicodemus':'니고데모'}</span> <span class="w place">${isEN()?'Jerusalem':'예루살렘'}</span> <span class="w rep">${isEN()?'Truly':'진실로'}</span></div>${withClose?'<button class="btn sm ghost" data-act="hlPanel" style="align-self:flex-end">닫기</button>':''}`}
const themeSeg=()=>{const t=getTheme();return `<div class="seg" role="group" aria-label="화면 테마">${[['auto','자동'],['light','밝게'],['dark','어둡게']].map(([v,l])=>`<button data-act="theme" data-val="${v}" aria-pressed="${t===v}">${l}</button>`).join('')}</div>`};
/* 화면 크기에 맞춰 자동으로: 실제 앱에는 미리보기 버튼이 없고, 테스트 앱의 미리보기도 기억하지 않아요 */
function setMP(on){document.body.classList.toggle('mp',on);measureTabs();const b=document.getElementById('mpBtn');if(b)b.textContent=on?'데스크탑 화면으로 보기':'휴대폰 화면으로 보기'}
try{localStorage.removeItem('boa-mp')}catch(e){}
(()=>{const b=document.getElementById('mpBtn');if(!b)return;if(DEPLOYED){b.remove();return}b.addEventListener('click',()=>setMP(!document.body.classList.contains('mp')))})();
setMP(false);
document.documentElement.lang=S.uiLang;if(isEN())document.title='Bible On Air';
boot();
setTimeout(maybeAskInstall,2500);
</script>
</body>
</html>
